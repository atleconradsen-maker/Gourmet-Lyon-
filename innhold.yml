# ─────────────────────────────────────────────────────────────
#  GOURMETKLUBBEN I LYON – alt innhold på nettsiden ligger her.
#  Rediger denne fila på GitHub (blyant-ikonet), trykk "Commit",
#  og siden oppdaterer seg selv etter ca. ett minutt.
#
#  Tips:
#  - Behold innrykket (mellomrom) slik det er. Bruk mellomrom, ikke tab.
#  - Tekst med kolon (:) i seg bør stå i "anførselstegn".
#  - Linjer som starter med # er kommentarer og vises ikke.
#  - chip kan være: book, ipa eller sjekk
#  - sted: gir en kartknapp på programpunktet. Skriv navnet på et sted
#    fra "steder" eller "overnatting" (da brukes adressen derfra),
#    eller en vanlig adresse/søketekst for Google Maps.
#  - hjem: under "tur" styrer «Ta meg hjem»-knappen nederst på mobil.
# ─────────────────────────────────────────────────────────────

tur:
  tittel: Lyon & Beaujolais
  # Startdato brukes til nedtellingen (år-måned-dag)
  start: 2027-09-23
  datoer: 23.–26. september 2027
  # «Ta meg hjem»-knappen gir veibeskrivelse hit (til fots)
  hjem: 4 Rue de la Loge 69005 Lyon
  undertittel: Gourmetklubben på tur
  ingress: "23.–26. september 2027. Fire dager med bouchon, Beaujolais-cru og skikkelig IPA. Første natt på vingård i Quincié, deretter to netter midt i gamlebyen i Lyon. Alt dere trenger å vite ligger her."
  fakta:
    - { etikett: Utreise, verdi: "Tor 23.9 · 07:00", tekst: "Norwegian DY 1454, Gardermoen → Lyon, lander 09:35" }
    - { etikett: Hjemreise, verdi: "Søn 26.9 · 14:40", tekst: "Norwegian DY 1455, Lyon → Gardermoen, lander 17:10" }
    - { etikett: Gjengen, verdi: 5 karer, tekst: "Mat, vin og IPA" }
    - { etikett: Bord å booke, verdi: 5 stk, tekst: Se sjekklista }

# En gul merknad øverst i programmet kan legges til slik:
# merknad:
#   tittel: Overskrift
#   tekst: Selve beskjeden

program:
  - dag: Torsdag 23. september
    hvor: Flyplassen → Beaujolais
    merke: Leiebil
    punkter:
      - { tid: "07:00", tittel: "Avgang Gardermoen, DY 1454", tekst: "Norwegian fra Oslo lufthavn. Vær på Gardermoen senest 05:30, og kjøp gjerne en kaffe til flyet." }
      - { tid: "09:35", tittel: Landing på Lyon-Saint Exupéry, sted: "Aéroport Lyon-Saint Exupéry", tekst: "Ta Europcars gratis shuttlebuss fra terminalen og hent leiebilen 10:30. Én sjåfør holder seg til smaksprøver." }
      - { tid: "10:30", tittel: Kjør mot Beaujeu, tekst: "Ca. 1 time via A46/A6. Innsjekk på vingården er først 16:00, så vi tar lunsj og smaking på veien." }
      - { tid: "12:30", tittel: Lunsj i Beaujeu, sted: "Beaujeu", chip: sjekk, tekst: "Beaujolais' gamle hovedstad, 10 min fra vingården. Le Retinton er et forslag. Book eller sjekk åpningstider." }
      - { tid: "14:30", tittel: "Le Comptoir Beaujolais, Beaujeu", sted: "Le Comptoir Beaujolais", tekst: "Hvelvet vinkjeller fra 1956 med over 40 viner fra 15 domener. Smak cru, spis ost og charcuterie, kjøp med hjem. Åpner igjen 14:30 etter lunsjpausen." }
      - { tid: "16:00", tittel: Innsjekk hos Yvan, sted: "Vingården i Quincié", tekst: "175 route de Saint-Nizier, Quincié-en-Beaujolais. Spør om smaking på domenet og grill til kvelden." }
      - { tid: "19:30", tittel: "Middag: Le Mont Brouilly", sted: "Le Mont Brouilly", chip: book, tekst: "Hotellrestaurant i Quincié, kort vei hjem. Alternativ: grill eller raclette på vingården med husets vin, avtal med verten på forhånd." }

  - dag: Fredag 24. september
    hvor: Beaujolais → Lyon
    merke: Bil → Uber
    punkter:
      - { tid: "09:00", tittel: Frokost og utsjekk, tekst: Utsjekk senest 10:00. }
      - { tid: "10:00", tittel: Kjør til flyplassen og lever bilen, sted: "Aéroport Lyon-Saint Exupéry", tekst: "Ikke kjør inn i Vieux Lyon: trange gater og nesten ingen parkering." }
      - { tid: "11:15", tittel: Uber til Vieux Lyon, sted: "Leilighet i Rue de la Loge", tekst: "Ca. 35–45 min. Innsjekk er først 15:00, så spør verten om vi kan sette fra oss bagasjen tidligere." }
      - { tid: "12:30", tittel: "Lang lunsj: Daniel et Denise Saint-Jean", sted: "Daniel et Denise Saint-Jean", chip: book, tekst: "Ekte bouchon i gamlebyen, ca. 10 min å gå fra leiligheten. Bestill pâté en croûte og quenelle." }
      - { tid: "15:00", tittel: Innsjekk i Rue de la Loge, sted: "Leilighet i Rue de la Loge", tekst: "4 rue de la Loge, Vieux Lyon. Vert er Valérie Stéphane." }
      - { tid: "15:45", tittel: Musée des Confluences, sted: "Musée des Confluences", tekst: "Vitenskap og antropologi i en bygning som er verdt turen alene. Uber ca. 15 min." }
      - { tid: "17:45", tittel: Bateau Bellona, sted: "Bateau Bellona", chip: sjekk, tekst: "Péniche-bar ved museet med terrasse over Rhône. Åpningstidene varierer etter sesong, så sjekk før dere går." }
      - { tid: "19:30", tittel: Ninkasi Gerland, sted: "Ninkasi Gerland", chip: ipa, tekst: "Lyons eget bryggeri. Stor brewpub med burgere og husets øl. Ca. 10 min med Uber fra Confluence." }

  - dag: Lørdag 25. september
    hvor: Hele dagen i Lyon
    merke: Til fots + Uber
    punkter:
      - { tid: "08:30", tittel: "Frokost: Boulangerie Saint-Vincent", sted: "Boulangerie Saint-Vincent", tekst: "5 min å gå over gangbrua Saint-Vincent. Åpner 07:30 på lørdager." }
      - { tid: "10:00", tittel: Les Halles Paul Bocuse, sted: "Les Halles Paul Bocuse", tekst: Matmarkedet. Østers og et glass hvitvin til formiddagen er helt akseptert her. Uber ca. 15 min. }
      - { tid: "11:30", tittel: Traboules i Vieux Lyon, sted: "54 Rue Saint-Jean Lyon", tekst: Skjulte passasjer gjennom bakgårdene. Start ved 54 rue Saint-Jean og 27 rue du Bœuf. }
      - { tid: "12:30", tittel: "Lang lunsj: Café Comptoir Abel", sted: "Café Comptoir Abel", chip: book, tekst: Bouchon fra 1928 nær Ainay. Kjent for tablier de sapeur og kardongratin. }
      - { tid: "15:00", tittel: Fourvière-basilikaen, sted: "Fourvière-basilikaen", tekst: Ta kabelbanen fra Vieux Lyon. Utsikten over hele byen fra terrassen bak kirken. }
      - { tid: "17:30", tittel: "Carousel Beer, Croix-Rousse", sted: "Carousel Beer", chip: ipa, tekst: Taproom med ca. 12 roterende fat og stort utvalg på boks. Terrasse på torget. Metro C eller Uber. }
      - { tid: "19:15", tittel: "Aperitiff: Le Phosphore", sted: "Le Phosphore Tetedoie Lyon", tekst: "Têtedoies vinbar med terrasse i samme hus. Et glass med utsikt over byen før vi går inn til middag." }
      - { tid: "20:00", tittel: "Middag: Têtedoie", sted: "Têtedoie", chip: book, tekst: "Kveldens store middag, på Fourvière-høyden med vinduer over byen. Uber fra Croix-Rousse ca. 15 min." }

  - dag: Søndag 26. september
    hvor: Hjemreise
    merke: Uber
    punkter:
      - { tid: "09:00", tittel: Croissant og kaffe, sted: "Boulangerie Saint-Vincent", tekst: Boulangerie Saint-Vincent er åpen til 15:00 på søndager. }
      - { tid: "11:00", tittel: Sjekk ut og pakk vinen godt, tekst: "Vin i innsjekket bagasje: pakk flaskene i klær eller vinbeskyttere." }
      - { tid: "11:45", tittel: Uber til flyplassen, sted: "Aéroport Lyon-Saint Exupéry", tekst: "Ca. 35–45 min, så vi er der rundt 12:30. Alternativ: Rhônexpress fra Part-Dieu, ca. 30 min." }
      - { tid: "14:40", tittel: "Fly hjem, DY 1455", sted: "Aéroport Lyon-Saint Exupéry", tekst: "Norwegian til Gardermoen, lander 17:10. Vær på flyplassen senest 12:40." }

# Spisesteder og barer. "kart" plasserer en nål på Lyon-kartet:
#   nr = tallet på nåla, x/y = posisjon (x 0–400 fra venstre, y 0–520 fra toppen),
#   type = mat eller ol (øl). Utelat "kart" for steder utenfor Lyon.
steder:
  - navn: Le Comptoir Beaujolais
    type: Vinkjeller · Beaujeu
    når: Torsdag ettermiddag
    tekst: Den gamle Beaujolais-Villages-kjelleren i Beaujolais' historiske hovedstad. Smaking fra 15 domener.
    bestill: en Morgon og en Moulin-à-Vent side om side, med lokal ost.
    adresse: 24 square du Temple de Bacchus, 69430 Beaujeu · 04 74 04 81 18
    sok: Le Comptoir Beaujolais Beaujeu

  - navn: Le Mont Brouilly
    type: Hotellrestaurant · Quincié
    når: Torsdag middag
    tekst: Sesongbasert mat fra lokale råvarer, kort vei fra vingården. Fin terrasse om været tillater.
    bestill: Côte de Brouilly fra åssiden rett utenfor.
    adresse: Quincié-en-Beaujolais
    sok: Le Mont Brouilly Quincié-en-Beaujolais

  - navn: Daniel et Denise Saint-Jean
    type: Bouchon · Vieux Lyon
    når: Fredag lunsj
    tekst: Joseph Viola-bouchon i gamlebyen. Klassisk lyonnais mat, gjort skikkelig.
    bestill: pâté en croûte, quenelle de brochet, en pot Côtes du Rhône.
    adresse: 36 rue Tramassac, 69005 Lyon
    sok: Daniel et Denise Saint-Jean Lyon
    nettside: https://danieletdenise.fr/daniel-denise-saint-jean/
    kart: { nr: 1, x: 128, y: 300, type: mat }

  - navn: Musée des Confluences
    type: Museum · Confluence
    når: Fredag ettermiddag
    tekst: Vitenskap, antropologi og en arkitektur som er verdt besøket alene. Stengt mandager.
    bestill: billetter på nett på forhånd.
    adresse: 86 quai Perrache, 69002 Lyon
    sok: Musée des Confluences Lyon
    nettside: https://www.museedesconfluences.fr/
    kart: { nr: 2, x: 232, y: 455, type: mat }

  - navn: Bateau Bellona
    type: Péniche-bar · Confluence
    når: Fredag ettermiddag
    tekst: Båt ved kaia rett ved museet, med terrasse og utsikt over Rhône.
    bestill: noe kaldt på terrassen. Sjekk åpningstider før dere går.
    adresse: 84 quai Perrache, 69002 Lyon
    sok: Bateau Bellona Lyon
    nettside: https://www.bateaubellona.fr/
    kart: { nr: 3, x: 258, y: 480, type: ol }

  - navn: Ninkasi Gerland
    type: Bryggeri · Gerland
    når: Fredag kveld
    tekst: Lyons egen brewpub siden 1997. Burgere, husets øl og konsertscene. Åpent alle dager, kjøkkenet til 23.
    bestill: en smaksplanke med husets IPA-er.
    adresse: 267 rue Marcel Mérieux, 69007 Lyon
    sok: Ninkasi Gerland Lyon
    nettside: https://www.ninkasi.fr/lieux/ninkasi-gerland/
    kart: { nr: 4, x: 300, y: 420, type: ol }

  - navn: Les Halles Paul Bocuse
    type: Matmarked · Part-Dieu
    når: Lørdag formiddag
    tekst: Lyons innendørs matmarked, med ost, charcuterie, østers og konditorer. Stengt mandag.
    bestill: østers og Mâcon blanc, saucisson fra Sibilia, ost fra Mère Richard.
    adresse: 102 cours Lafayette, 69003 Lyon
    sok: Les Halles de Lyon Paul Bocuse
    nettside: https://www.halles-de-lyon-paulbocuse.com/
    kart: { nr: 5, x: 342, y: 220, type: mat }

  - navn: Café Comptoir Abel
    type: Bouchon · Ainay
    når: Lørdag lunsj
    tekst: En av byens eldste bouchons, med trepanel og rutete duker. Store porsjoner.
    bestill: tablier de sapeur, gratin de cardons, quenelle.
    adresse: 25 rue Guynemer, 69002 Lyon
    sok: Café Comptoir Abel Lyon
    kart: { nr: 6, x: 210, y: 355, type: mat }

  - navn: Fourvière-basilikaen
    type: Utsikt · Fourvière
    når: Lørdag ettermiddag
    tekst: Basilikaen på høyden over gamlebyen. Utsikten fra terrassen er den beste i byen.
    bestill: kabelbanen opp, og gå ned trappene gjennom hagene.
    adresse: 8 place de Fourvière, 69005 Lyon
    sok: Basilique Notre-Dame de Fourvière
    nettside: https://www.fourviere.org/
    kart: { nr: 7, x: 95, y: 235, type: mat }

  - navn: Carousel Beer
    type: Taproom · Croix-Rousse
    når: Lørdag apéro
    tekst: Ca. 12 roterende fat og en kjøl full av boks og flasker fra små bryggerier. Terrasse på torget.
    bestill: det ferskeste IPA-fatet. Spør i baren.
    adresse: 3 place Marcel Bertone, 69004 Lyon · Metro C Croix-Rousse
    sok: Carousel Beer Lyon Croix-Rousse
    kart: { nr: 8, x: 220, y: 80, type: ol }

  - navn: Têtedoie
    type: Gastronomi · Fourvière
    når: Lørdag middag
    tekst: Christian Têtedoies restaurant på høyden, med glassvegger mot byen. Turens store middag.
    bestill: smaksmenyen med vinpakke, og ta en dram på terrassen etterpå.
    adresse: 4 rue du Professeur Pierre Marion, 69005 Lyon
    sok: Têtedoie Lyon
    nettside: https://tetedoie.fr/
    kart: { nr: 9, x: 112, y: 200, type: mat }

  - navn: Boulangerie Saint-Vincent
    type: Bakeri · Quai Saint-Vincent
    når: Lørdag og søndag frokost
    tekst: "Like over Saône fra leiligheten, 5 min å gå over gangbrua. Stengt mandag, ellers åpent fra 07:00–07:30."
    bestill: pain au chocolat, en praline-brioche og en café crème.
    adresse: 49 quai Saint-Vincent, 69001 Lyon
    sok: Boulangerie Saint-Vincent 49 quai Saint-Vincent Lyon

overnatting:
  - navn: Vingården i Quincié
    når: Tor 23.9 16:00 → fre 24.9 10:00 · 1 natt
    tekst: Hus på vingård i Quincié-en-Beaujolais, midt i cru-landskapet. Vert er Yvan.
    punkter:
      - "Adresse: 175 route de Saint-Nizier, 69430 Quincié-en-Beaujolais"
      - "Innsjekk 16:00, utsjekk 10:00"
      - Spør om vinsmaking på domenet og grill til kvelden
      - 10 min til Beaujeu, ca. 1 time til flyplassen
    sok: 175 Route de Saint-Nizier Quincié-en-Beaujolais

  - navn: Leilighet i Rue de la Loge
    når: Fre 24.9 15:00 → søn 26.9 12:00 · 2 netter
    tekst: Hvelvet leilighet midt i Vieux Lyon, ved Saint-Paul. Vert er Valérie Stéphane.
    punkter:
      - "Adresse: 4 rue de la Loge, 69005 Lyon"
      - "Innsjekk 15:00, utsjekk 12:00"
      - 10 min å gå til Daniel et Denise, 5 min til bakeriet over Saône
      - Kabelbanen til Fourvière går fra stasjonen Vieux Lyon, ca. 10 min unna
    sok: 4 Rue de la Loge 69005 Lyon
    kart: { nr: H, x: 138, y: 248, type: hjem }

transport:
  ingress: Bil i Beaujolais, beina og Uber i Lyon. Fem personer passer ikke i en vanlig Uber, så bestill to biler eller en UberXL.
  strekninger:
    - { fra: Oslo → Lyon, hvordan: "Norwegian DY 1454, tor 23.9, 07:00 → 09:35", tid: 2 t 35 min }
    - { fra: Lyon → Oslo, hvordan: "Norwegian DY 1455, søn 26.9, 14:40 → 17:10", tid: 2 t 30 min }
    - { fra: Flypris tur-retur, hvordan: "1 800 kr per person med håndbagasje, 2 800 kr med én innsjekket koffert (25 kg)", tid: per person }
    - { fra: Leiebil, hvordan: "Europcar på flyplassen, Toyota Corolla Estate eller lignende. Automat, 5 seter, plass til 4 kofferter. Gratis shuttlebuss fra terminalen. Full tank ut og full tank inn.", tid: "2 084 kr, ca. 417 kr per person" }
    - { fra: Flyplass → Quincié, hvordan: Leiebil via A46 og A6, tid: ca. 1 t }
    - { fra: Quincié → Beaujeu, hvordan: Leiebil gjennom vinmarkene, tid: ca. 10 min }
    - { fra: Quincié → flyplass, hvordan: Lever bilen på flyplassen fredag formiddag, tid: ca. 1 t }
    - { fra: Flyplass → Lyon, hvordan: "UberXL til Rue de la Loge, eller Rhônexpress til Part-Dieu", tid: 35–45 min }
    - { fra: Vieux Lyon → Fourvière, hvordan: Kabelbanen (funiculaire) fra stasjonen Vieux Lyon, tid: ca. 5 min }
    - { fra: I byen, hvordan: "Metro, trikk og buss (TCL). Kjøp billett i TCL-appen eller betal med bankkort", tid: 10–20 min }

praktisk:
  - { etikett: Nødnummer, stor: "112", tekst: "Politi, brann og ambulanse. Legevakt: 15. Apotek har grønt kors." }
  - { etikett: Ambassade, tittel: Norges ambassade i Paris, tekst: "28 rue Bayard, 75008 Paris · +33 1 53 67 04 00" }
  - { etikett: Flypris, tittel: "1 800–2 800 kr per person", tekst: "Tur-retur med Norwegian. 1 800 kr med bare håndbagasje, 2 800 kr med én innsjekket koffert på 25 kg. Skal du ta med vin hjem, trenger du innsjekket bagasje." }
  - { etikett: Penger, tittel: Euro, tekst: Kort fungerer nesten overalt. Ha noen kontanter til små bakerier og markedsboder. }
  - { etikett: Tips, tittel: Service er inkludert, tekst: "«Service compris» står på regningen. Rund opp eller legg 5–10 % ved god service." }
  - { etikett: Strøm og tid, tittel: Som hjemme, tekst: Norske ladere passer (type E). Samme tidssone som Norge. }
  - { etikett: Vær i slutten av september, tittel: "13–23 °C", tekst: "Som regel tørt og mildt, kjølig om kvelden. Ta med en lett jakke og gode sko til brosteinen." }
  - { etikett: Måltider, tittel: Franske tider, tekst: "Lunsj 12–14, middag fra 19:30. Kjøkken stenger ofte mellom 14 og 19." }

fraser:
  - { norsk: "Vi har bestilt bord til fem", fransk: Nous avons réservé pour cinq }
  - { norsk: "En flaske av husets rødvin", fransk: "Un pot de rouge, s'il vous plaît" }
  - { norsk: "Hva anbefaler du?", fransk: "Qu'est-ce que vous nous conseillez ?" }
  - { norsk: "En stor øl fra fat / en IPA", fransk: "Une pinte / une IPA, s'il vous plaît" }
  - { norsk: "Regningen, takk", fransk: "L'addition, s'il vous plaît" }
  - { norsk: "Skål!", fransk: "Santé !" }

retter:
  - { navn: Quenelle de brochet, tekst: Luftig gjeddefarse bakt i krepsesaus (sauce Nantua). Lyons signaturrett. }
  - { navn: Tablier de sapeur, tekst: "«Brannmannsforkleet»: marinert vom, panert og stekt. Bedre enn det høres ut." }
  - { navn: Saucisson brioché, tekst: Pølse bakt inn i briochedeig. }
  - { navn: Andouillette, tekst: Innmatpølse med sterk smak. Bare for de modige. }
  - { navn: Cervelle de canut, tekst: "Fersk ost med urter, sjalott og olje. Ingen hjerne, til tross for navnet." }
  - { navn: Pot lyonnais, tekst: "Lyons husvinflaske på 46 cl. Bestill «un pot de …»." }
  - { navn: Tarte aux pralines, tekst: Rosa brente mandler smeltet til en pai. Obligatorisk dessert. }

sjekkliste:
  - Book leiebil på Lyon-Saint Exupéry med plass til fem og bagasje, med levering samme sted
  - Book lunsj i Beaujeu torsdag
  - Book torsdagsmiddag på Le Mont Brouilly, eller avtal grill med Yvan
  - Spør Valérie Stéphane om vi kan sette fra oss bagasjen før 15:00 fredag
  - Book Daniel et Denise Saint-Jean, fredag 12:30, fem personer
  - Book Café Comptoir Abel, lørdag 12:30, fem personer
  - Book Têtedoie, lørdag 20:00, fem personer
  - Kjøp billetter til Musée des Confluences på nett
  - Last ned Uber og TCL-appen
  - Pakk vinbeskyttere til flaskene i innsjekket bagasje
  - Ta med førerkort til sjåføren

# ─────────────────────────────────────────────────────────────
#  BARER OG UTESTEDER – "apent" vises på kortet.
# ─────────────────────────────────────────────────────────────
barer:
  - navn: La Mi Graine
    type: Bar · Saint-Paul
    tekst: Koselig nabolagsbar med terrasse på torget, 2 min fra leiligheten. Godt utvalg belgisk øl og ofte jazz manouche.
    apent: Alle dager 15:00–03:00
    adresse: 11 place Saint-Paul, 69005 Lyon
    sok: La Mi Graine Lyon

  - navn: La Cave des Voyageurs
    type: Vinbar · Saint-Paul
    tekst: En av Lyons eldste vinbarer, rett rundt hjørnet. Naturvin og småretter.
    apent: Tirsdag–lørdag 17:00–01:00
    adresse: 7 place Saint-Paul, 69005 Lyon
    sok: La Cave des Voyageurs Lyon

  - navn: Bar du 405
    type: Ølbar · Presqu'île
    tekst: Rundt 50 øl på fat fordelt på to barer i samme gate. Biljard, sportsstemning og høyt lydnivå.
    apent: Kveld, sjekk dagens tider
    adresse: 9 rue Constantine, 69001 Lyon
    sok: Bar du 405 Lyon

  - navn: Dikkenek
    type: Belgisk ølbar · Croix-Rousse
    tekst: Stor terrasse og belgisk øl i massevis. Passer fint før eller etter Carousel lørdag.
    apent: Kveld, sjekk dagens tider
    adresse: 3 rue d'Austerlitz, 69004 Lyon
    sok: Dikkenek Lyon

  - navn: L'Antiquaire
    type: Cocktailbar · Pentes de la Croix-Rousse
    tekst: Speakeasy med noen av byens beste cocktails. Ring på og vent på å bli sluppet inn.
    apent: "Alle dager fra 18:00, til 03:00 fredag og lørdag"
    adresse: 20 rue Hippolyte Flandrin, 69001 Lyon
    sok: L'Antiquaire Lyon

  - navn: Le Sucre
    type: Klubb på taket · Confluence
    tekst: Takterrasse og klubb på den gamle sukkerfabrikken ved Saône. Elektronisk musikk til langt på natt.
    apent: "Fredag og lørdag 23:00–05:00"
    adresse: 50 quai Rambaud, 69002 Lyon
    sok: Le Sucre Lyon
    nettside: https://le-sucre.eu/

# ─────────────────────────────────────────────────────────────
#  VIDARS CORNER
# ─────────────────────────────────────────────────────────────
vidar:
  ingress: "Gjengens egen gladgutt har gjort grundig feltarbeid og funnet noen steder der slitne gourmeter kan slappe av i hyggelig dameselskap etter en lang dag med quenelle og cru. Champagnen er dyr, musikken er høy og blikkene er gratis. Husk regelen: se, smil og tips, men ikke rør. Hva som skjer i Vidars corner, blir i Vidars corner."
  steder:
    - navn: Bus Paradise
      type: Gentlemen's club · Cité Internationale
      tekst: Byens mest kjente gentlemen's club, langs Rhône ved Parc de la Tête d'Or. Champagne-priser.
      apent: Tirsdag–lørdag 22:00–05:00
      adresse: 44 quai Charles de Gaulle, 69006 Lyon
      sok: Bus Paradise Lyon
      chip: sjekk

    - navn: Vertige Strip
      type: Gentlemen's club · Presqu'île
      tekst: Midt i sentrum, kort Uber fra gamlebyen.
      apent: Kveld og natt, sjekk tider
      adresse: 5 rue du Griffon, 69001 Lyon
      sok: Vertige Strip 5 rue du Griffon Lyon
      chip: sjekk

    - navn: Ô Boudoir
      type: Burlesk kabaret · Ainay
      tekst: "Den elegante varianten: burlesk show med cocktails. Showene går på lørdagskvelder, så book bord."
      apent: "Fra 19:00, show lørdag kveld"
      adresse: 15 rue de Condé, 69002 Lyon
      sok: Ô Boudoir Lyon
      chip: book

# ─────────────────────────────────────────────────────────────
#  FORSLAG TIL MORO – idéer, ikke plan. Slett det dere ikke vil ha.
# ─────────────────────────────────────────────────────────────
moro:
  - tittel: Gourmetklubbens blindtest
    tekst: "Kjøp fem cru-flasker på Le Comptoir Beaujolais torsdag. Blindsmak på vingården om kvelden: hver gjetter landsby og pris, og taperen bærer vinkassa resten av turen."
  - tittel: Quenelle-kåringen
    tekst: "Alle gir karakter 1–6 på hver bouchon-rett gjennom helga. Vinneren kåres over middagen på Têtedoie."
  - tittel: Pétanque i parken
    tekst: "Kjøp et sett kuler og spill på grusen langs Saône. Taperlaget spanderer pastis."
    sted: Quai Saint-Antoine Lyon
  - tittel: Søndagsmarked på Quai Saint-Antoine
    tekst: "Lyons store matmarked langs Saône, 5 min fra leiligheten. Østers og hvitvin til frokost før flyet."
    sted: Marché Saint-Antoine Lyon
  - tittel: Båttur på Saône
    nettside: https://www.lesbateauxlyonnais.com/
    tekst: "Les Bateaux Lyonnais kjører sightseeing og lunsjcruise fra kaiene i sentrum. Rolig avslutning på en lang lunsj."
    sted: Les Bateaux Lyonnais
  - tittel: Fotballkamp med Olympique Lyonnais
    tekst: "Sjekk terminlista når den slippes. Spiller OL hjemme helga 24.–26. september, er det en stor opplevelse på Groupama Stadium."
    sted: Groupama Stadium Décines
  - tittel: Klubb-t-skjorter
    tekst: "Trykk Gourmetklubben-logoen på fem t-skjorter til lørdagens pubrunde. Gjør det også lettere å finne hverandre igjen."
  - tittel: Ølspa på The Holy Hop
    tekst: "Lyons første ølspa: privat trebadestamp med humle og malt, fatøl og spekeplanke. Opptil fire per rom, så vi trenger to. Sjekk adressen ved booking, de har midlertidig flyttet."
    sted: The Holy Hop Beer Spa Lyon
    nettside: https://www.theholyhop.com/
  - tittel: Pubrunde i Saint-Paul
    tekst: "La Mi Graine, La Cave des Voyageurs og flere barer ligger rundt samme torg, 2 min fra senga. Perfekt avslutning lørdag kveld."
    sted: Place Saint-Paul Lyon

# ─────────────────────────────────────────────────────────────
#  IPA-GUIDEN – barer med skikkelig humle
# ─────────────────────────────────────────────────────────────
ipa:
  ingress: "For oss som ikke kan drikke bare vin. Stedene med flest fat og ferskest humle, sortert etter hvor lett de passer inn i programmet."
  steder:
    - navn: Carousel Beer
      type: Taproom · Croix-Rousse
      tekst: Rundt 12 roterende fat fra små bryggerier og en kjøl full av ferske bokser. Allerede i programmet lørdag.
      apent: Kveld alle dager, fra 17:00 fredag og lørdag
      bestill: Det ferskeste IPA- eller DIPA-fatet. Spør hva som kom inn sist.
      adresse: 3 place Marcel Bertone, 69004 Lyon
      sok: Carousel Beer Lyon Croix-Rousse
    - navn: Dr Yeast
      type: Ølbar · Croix-Rousse
      tekst: "Rundt 30 fat i en gammel steinbygning, og raclette så mye du orker. 5 min å gå fra Carousel, så de to kan tas i samme slengen."
      apent: "Tir–fre 16:00–01:00, lør 11:00–01:00, søn–man 17:00–00:00. Happy hour 17–21."
      adresse: 6 rue de Cuire, 69004 Lyon
      sok: Dr Yeast Lyon
    - navn: Les Fleurs du Malt
      type: Ølbar og ølbutikk · Vieux Lyon
      tekst: "Ølkjeller langs Saône, 5 min fra leiligheten. Tønner som stoler, dartskive og ølbutikk der du kan kjøpe med hjem."
      apent: Alle dager 17:00–02:00
      adresse: 15 quai Romain Rolland, 69005 Lyon
      sok: Les Fleurs du Malt Lyon
    - navn: Malting Pot Part-Dieu
      type: Bryggeripub · Part-Dieu
      tekst: "Brygger på stedet, med rundt ti egne øl som roterer. Ligger rett bak Part-Dieu, nær Les Halles Paul Bocuse."
      apent: Sjekk dagens tider
      adresse: 2 place de Francfort, 69003 Lyon
      sok: Malting Pot Lyon Part-Dieu
      chip: sjekk
    - navn: Ninkasi Gerland
      type: Bryggeri · Gerland
      tekst: Lyons eget bryggeri. Husets IPA-er og sesongøl. Allerede i programmet fredag kveld.
      apent: Alle dager, kjøkken til 23:00
      adresse: 267 rue Marcel Mérieux, 69007 Lyon
      sok: Ninkasi Gerland Lyon
      nettside: https://www.ninkasi.fr/lieux/ninkasi-gerland/
    - navn: Bar du 405
      type: Ølbar · Presqu'île
      tekst: Rundt 50 øl på fat fordelt på to barer i samme gate. Mer bredde enn nisje, men alltid noen IPA-er på listen.
      apent: Kveld, sjekk dagens tider
      adresse: 9 rue Constantine, 69001 Lyon
      sok: Bar du 405 Lyon
    - navn: La Kave Maltée
      type: Craft beer-bar · Brotteaux
      tekst: Ti fat og rundt 50 bokser og flasker fra uavhengige bryggerier, pluss snacks.
      apent: Sjekk dagens tider
      adresse: 81 rue Louis Blanc, 69006 Lyon
      sok: La Kave Maltée Lyon
      chip: sjekk
    - navn: Orgao
      type: Craft beer-bar · Gerland
      tekst: Rundt 12 fat og ansatte som gjerne forteller om hver øl. Et alternativ hvis Ninkasi er fullt.
      apent: Sjekk dagens tider
      adresse: 145 rue Sébastien Gryphe, 69007 Lyon
      sok: Orgao Lyon
      chip: sjekk
    - navn: Bieristan
      type: Craft beer-bar · Villeurbanne
      tekst: "Lokalkjent favoritt for IPA-nerder, med øl fra hele regionen og hage bak. Ligger et stykke ut, ca. 20 min med Uber."
      apent: Kveld, fullt i helgene
      adresse: 14 rue Paul Lafargue, 69100 Villeurbanne
      sok: Bieristan Villeurbanne

# ─────────────────────────────────────────────────────────────
#  TAXI – nummer = det som ringes. Skriv med mellomrom slik det vises.
# ─────────────────────────────────────────────────────────────
taxi:
  ingress: "Trykk for å ringe. Vi er fem, så be om en stor bil: «Un taxi pour cinq personnes, s'il vous plaît.» Oppgi adressen sakte og tydelig."
  grupper:
    - tittel: I Lyon
      nummer:
        - { navn: Taxi Radio de Lyon, nummer: "04 72 10 86 86" }
        - { navn: TL Taxis Lyonnais, nummer: "04 78 26 81 81" }
        - { navn: Allo Taxi, nummer: "04 78 28 23 23" }
    - tittel: I Beaujolais (Quincié)
      nummer:
        - { navn: Taxi Janin, nummer: "04 74 66 08 50" }
        - { navn: Taxi Roche, nummer: "04 74 04 31 95" }
  apper: "Uber fungerer godt i Lyon. Velg UberXL for fem personer, eller bestill to vanlige biler. På landet i Beaujolais er det nesten ingen Uber, så ring taxi i god tid."
  adresser:
    - { navn: Leiligheten i Lyon, adresse: "4 rue de la Loge, 69005 Lyon" }
    - { navn: Vingården, adresse: "175 route de Saint-Nizier, 69430 Quincié-en-Beaujolais" }

# ─────────────────────────────────────────────────────────────
#  NOE FOR GUTTA – ett avsnitt per person
# ─────────────────────────────────────────────────────────────
gutta:
  - person: Dag
    rolle: Bilmannen
    ingress: "Volvo, Zeekr og Polestar til daglig. Visste du at Renault Trucks også er en del av Volvo-konsernet, med hovedkontor rett utenfor Lyon? Her er stedene for en ekte bilmann."
    steder:
      - navn: Musée de l'Automobile Henri Malartre
        type: Bilmuseum · Rochetaillée-sur-Saône
        tekst: "Rundt hundre kjøretøy i et slott ved Saône: biler, motorsykler og trikker. Her står Hitlers paradebil fra Mercedes, Lumière-brødrenes Vivastella og biler fra glemte Lyon-merker som Rochet-Schneider og Luc Court. Verkstedet holder de fleste i kjørbar stand."
        apent: "Onsdag–søndag 10:30–18:00 (siste billett 17:00). 6 €."
        bestill: "Ligger 15 min nord for Lyon. Passer på torsdag med leiebilen, på vei fra flyplassen til Beaujolais."
        adresse: 645 rue du Musée, 69270 Rochetaillée-sur-Saône
        sok: Musée de l'Automobile Henri Malartre
        nettside: https://www.musee-malartre.com/

  - person: Morten J
    rolle: Lysdesigneren
    ingress: "Lyon kaller seg lysets by. Byen har hatt en egen lysplan siden 1989, med over 300 monumenter, broer og fasader som er lyssatt hver kveld. Fête des Lumières er i desember, men i september har vi lyset helt for oss selv."
    steder:
      - navn: Kveldsvandring i lysbyen
        type: Lysvandring · Vieux Lyon og Presqu'île
        tekst: "Start ved Palais de Justice med de 24 søylene, som har tre ulike lysprogram hver kveld, rett ved leiligheten. Gå langs Saône (gult lys) over til Rhône (hvitt lys), videre til Opéra, som lyser rødt på forestillingskvelder, og Place des Jacobins. Avslutt med Fourvière lyst opp over byen."
        apent: Fra skumring, ca. 19:45 i slutten av september
        bestill: Ta den etter middag fredag eller lørdag. Ca. 1 time i rolig tempo.
        adresse: Start ved Palais de Justice, 24 quai Romain Rolland, 69005 Lyon
        sok: Palais de Justice historique Lyon
      - navn: Musée Lumière
        type: Film- og lysmuseum · Monplaisir
        tekst: "I villaen til familien Lumière, der brødrene oppfant kinematografen i 1895. Museum om lys, bilde og film, med kino i hangaren der verdens første film ble spilt inn."
        apent: Tirsdag–søndag 10:00–18:30
        adresse: 25 rue du Premier Film, 69008 Lyon
        sok: Musée Lumière Lyon
        nettside: https://www.institut-lumiere.org/
      - navn: Fourvière på innsiden
        type: Guidet tur · Fourvière
        tekst: "Omvisning over hvelvene, i stålkonstruksjonen og opp i observatorietårnet med utsikt over hele byen. Kveldsturene går bare om vinteren, men dagturene går også i september."
        apent: Sjekk datoer på booking.fourviere.org. Ca. 18 €.
        adresse: 8 place de Fourvière, 69005 Lyon
        sok: Basilique Notre-Dame de Fourvière
        nettside: https://booking.fourviere.org/
        chip: sjekk

  - person: Morten G
    rolle: Etterforskeren
    ingress: "Etterforskningsleder i Follo. Lyon har mer politihistorie enn de fleste byer: Interpol har hovedkontoret sitt her, og Klaus Barbie, «slakteren fra Lyon», ble dømt i retten rett ved leiligheten vår."
    steder:
      - navn: Palais de Justice historique
        type: Rettsbygning · Vieux Lyon
        tekst: "Den gamle rettsbygningen med de 24 søylene. Her ble Gestapo-sjefen Klaus Barbie dømt til livstid i 1987. 3 min å gå fra leiligheten."
        apent: Se fasaden når som helst. Omvisninger inne ved spesielle anledninger.
        adresse: 24 quai Romain Rolland, 69005 Lyon
        sok: Palais de Justice historique Lyon
      - navn: Mémorial national de la prison de Montluc
        type: Fengsel og minnested · Lyon 3e
        tekst: "Militærfengsel der Gestapo holdt motstandsfolk, blant dem Jean Moulin. Cellene står som de var. Sterkt og stillferdig."
        apent: "Onsdag–fredag 14:00–18:00, lørdag 10:00–12:30 og 14:00–18:00. Gratis."
        adresse: 1 rue Jeanne Hachette, 69003 Lyon
        sok: Mémorial national de la prison de Montluc
      - navn: CHRD, i det gamle Gestapo-hovedkvarteret
        type: Museum · Lyon 7e
        tekst: "Senter for motstandskampen, i bygningen der Barbie hadde kontor og avhørsrom. Passer godt sammen med Montluc."
        apent: Sjekk tider på chrd.lyon.fr
        adresse: 14 avenue Berthelot, 69007 Lyon
        sok: CHRD Lyon
        nettside: https://www.chrd.lyon.fr/
        chip: sjekk
      - navn: Interpol, hovedkvarteret
        type: Bare utenfra · Cité Internationale
        tekst: "Interpols generalsekretariat ligger langs Rhône. Ingen omvisning, men et obligatorisk gruppebilde ved gjerdet. Ligger forresten et steinkast fra Bus Paradise i Vidars corner."
        apent: Kun utenfra
        adresse: 200 quai Charles de Gaulle, 69006 Lyon
        sok: Interpol General Secretariat Lyon
        nettside: https://www.interpol.int/

  - person: Vidar
    rolle: Tømreren
    ingress: "Vieux Lyon er et av Europas største renessansekvarter, med bjelkelag og takkonstruksjoner fra 1400- og 1500-tallet. Her er godbitene for en fagmann. Vidar har dessuten sitt eget hjørne lenger opp på siden."
    steder:
      - navn: Tour Rose, 16 rue du Bœuf
        type: Renessansegård · Vieux Lyon
        tekst: "Byens mest kjente bakgård, med et rosa trappetårn og gallerier i flere etasjer. 5 min å gå fra leiligheten."
        apent: Gården er som regel åpen på dagtid
        adresse: 16 rue du Bœuf, 69005 Lyon
        sok: Tour Rose 16 rue du Boeuf Lyon
      - navn: Traboules og takbjelker i Saint-Jean
        type: Vandring · Vieux Lyon
        tekst: "Gå inn portene i rue Saint-Jean og rue du Bœuf. Se opp: synlige bjelkelag, utkragede gallerier og trappetårn. 54 rue Saint-Jean er den lengste traboulen."
        apent: Dagtid, mange porter er låst om kvelden
        adresse: 54 rue Saint-Jean, 69005 Lyon
        sok: 54 Rue Saint-Jean Lyon
      - navn: Pérouges
        type: Middelalderby · 40 min øst for Lyon
        tekst: "Perfekt bevart middelalderby med bindingsverkshus og brostein, brukt i en rekke filmer. Kjent for galette au sucre. Bare 20 min fra flyplassen."
        apent: Byen er åpen hele døgnet
        bestill: "En idé til torsdag: kjør fra flyplassen til Pérouges for lunsj, og så videre til Beaujolais (ca. 1 t 15)."
        adresse: Cité médiévale, 01800 Pérouges
        sok: Cité médiévale de Pérouges
        nettside: https://www.perouges-bugey-tourisme.com/

# ─────────────────────────────────────────────────────────────
#  MÅ SPISE / MÅ DRIKKE – "hvor" er et tips til hvor vi får det
# ─────────────────────────────────────────────────────────────
ma_spise:
  - navn: Quenelle de brochet
    tekst: Luftig gjeddefarse gratinert i krepsesaus (sauce Nantua). Lyons nasjonalrett.
    hvor: Daniel et Denise, Café Comptoir Abel
  - navn: Tablier de sapeur
    tekst: Marinert vom, panert og stekt, servert med sauce gribiche. Testen på om man er en ekte gourmet.
    hvor: Café Comptoir Abel
  - navn: Pâté en croûte
    tekst: Postei i butterdeig med foie gras og kjøttfarse. Kokken bak Daniel et Denise, Joseph Viola, er tidligere verdensmester i faget.
    hvor: Daniel et Denise
  - navn: Saucisson brioché
    tekst: Lyonpølse (ofte med pistasj) bakt inn i brioche. Perfekt til et glass Beaujolais.
    hvor: Les Halles Paul Bocuse, bouchonene
  - navn: Salade lyonnaise
    tekst: "Frisésalat med sprø bacon, krutonger og posjert egg. Lett nok til å gi plass til hovedretten."
    hvor: Alle bouchons
  - navn: Poulet de Bresse
    tekst: Verdens mest berømte kylling, fra Bresse rett nord for Lyon. Gjerne «au vinaigre» eller i kremsaus med morkler.
    hvor: Têtedoie, Les Halles
  - navn: Gratin de cardons
    tekst: Kardon (i slekt med artisjokk) gratinert med beinmarg. Høstsesong, så vi treffer perfekt i september.
    hvor: Café Comptoir Abel
  - navn: Cervelle de canut
    tekst: Fersk ost med urter, sjalott og olje. «Silkevevernes hjerne», men ingen hjerne.
    hvor: Alle bouchons, som forrett
  - navn: Saint-Marcellin
    tekst: Liten, kremet kumelkost som renner ut av skallet når den er moden. Lyons yndlingsost.
    hvor: La Mère Richard i Les Halles
  - navn: Tarte aux pralines
    tekst: Rosa brente mandler smeltet ned i en pai. Lyons signaturdessert.
    hvor: Bakeriene, Les Halles
  - navn: Coq au vin de Beaujolais
    tekst: Hane langtidskokt i Beaujolais-vin med sopp og bacon. Smaker aller best der vinen kommer fra.
    hvor: Beaujolais, torsdag
  - navn: Galette au sucre
    tekst: Tynn brioche-terte med smør og sukker, spesialiteten fra Pérouges.
    hvor: Pérouges

ma_drikke:
  - navn: Communard
    type: Aperitiff · Beaujolais
    tekst: "Beaujolais-rødvin med en skvett crème de cassis. Den lokale fetteren til kir, og ingen andre steder smaker den bedre."
  - navn: Beaujolais blanc og Saint-Véran
    type: Hvitvin · Beaujolais og Mâconnais
    tekst: Chardonnay fra nabolaget. Frisk, rimelig og perfekt til østers på Les Halles. Pouilly-Fuissé hvis vi vil spandere.
  - navn: Condrieu
    type: Hvitvin · Nord-Rhône
    tekst: "Viognier fra 40 min sør for Lyon. Aprikos, fersken og blomster. Fantastisk til quenelle i krepsesaus."
  - navn: Crémant de Bourgogne
    type: Musserende · Burgund
    tekst: Champagne-metoden til en brøkdel av prisen. Perfekt start på lange lunsjer.
  - navn: Beaujolais rosé
    type: Rosé · Beaujolais
    tekst: Lys og frisk gamay-rosé. Godt på en terrasse i septembersola.
  - navn: Chartreuse
    type: Urtelikør · Alpene
    tekst: "Grønn (55 %) eller gul (40 %), laget av munker i fjellene sørøst for Lyon etter en hemmelig oppskrift med 130 urter. Klassisk digestif etter Têtedoie."
  - navn: Ninkasi IPA
    type: Øl · Lyon
    tekst: Lyons egen IPA. Ta en på Ninkasi Gerland, og sjekk ut IPA-guiden for resten.
  - navn: Pastis
    type: Aperitiff · Sør-Frankrike
    tekst: "Anislikør blandet med kaldt vann. Det man drikker til pétanque langs Saône, enten man liker det eller ikke."
  - navn: Morgon og Moulin-à-Vent
    type: Rødvin · Beaujolais cru
    tekst: For ordens skyld. De kraftigste cruene, rett utenfor døra på vingården i Quincié.

# ─────────────────────────────────────────────────────────────
#  HIDDEN GEMS – det turistene ikke finner
# ─────────────────────────────────────────────────────────────
gems:
  ingress: "Steder lyonnaisene helst holder for seg selv. Flere av dem ligger et steinkast fra leiligheten."
  steder:
    - navn: Bon-Secours Bar
      type: Skjult cocktailbar · Vieux Lyon
      tekst: "1930-tallsbar gjemt i en hvelvet kjeller under en sjokoladebutikk fra 1500-tallet. Cocktails laget på likører fra Crozet-destilleriet. 3 min fra leiligheten."
      apent: Fredag, lørdag og mandag 19:00–00:00
      adresse: 12 rue du Bœuf, 69005 Lyon
      sok: Ambassade Bonnat Crozet 12 rue du Boeuf Lyon
    - navn: Jardin Rosa Mir
      type: Hemmelig hage · Croix-Rousse
      tekst: "En spansk murer bygde denne hagen stein for stein i bakgården sin fra 1957, med skjell og rullestein. Fredet i dag. Ligger 5 min fra Carousel, så den passer fint lørdag ettermiddag."
      apent: "Bare lørdager 13:00–18:00, april–oktober. Gratis."
      adresse: 87 grande rue de la Croix-Rousse, 69004 Lyon
      sok: Jardin Rosa Mir Lyon
    - navn: Mur des Canuts
      type: Gigantisk veggmaleri · Croix-Rousse
      tekst: "Europas største trompe-l'oeil, 1200 m² med trapper, butikker og folk som ser helt ekte ut. Ta et gruppebilde der det ser ut som vi går opp trappa."
      apent: Døgnet rundt. Gratis.
      adresse: 36 boulevard des Canuts, 69004 Lyon
      sok: Mur des Canuts Lyon
    - navn: Fresque des Lyonnais
      type: Veggmaleri · Quai Saint-Vincent
      tekst: "Trompe-l'oeil med 30 kjente lyonnaiser i vinduene, blant dem Paul Bocuse, Lumière-brødrene og Den lille prinsen. 5 min fra leiligheten, over gangbrua."
      apent: Døgnet rundt. Gratis.
      adresse: 2 rue de la Martinière, 69001 Lyon
      sok: Fresque des Lyonnais
    - navn: Mâchon kl. 9
      type: Lyon-tradisjon · bouchon
      tekst: "Silkevevernes gamle frokost: pølser, terrine, ost og en pot Beaujolais klokka ni om morgenen. Flere bouchons arrangerer mâchon i helgene, blant dem Auberge des Canuts. Det er like lyonsk som det blir."
      apent: Helgemorgener, sjekk og book
      adresse: Auberge des Canuts, Lyon
      sok: Auberge des Canuts Lyon
      chip: sjekk
    - navn: Micro Sillon
      type: Vinbar · Presqu'île
      tekst: "Vinbar og vinhandel med terrasse på et lite torg, med østers, ost og charcuterie. Lokalfolk, ikke turister."
      apent: Kveld, sjekk dagens tider
      adresse: 6 place Fernand Rey, 69001 Lyon
      sok: Micro Sillon Lyon
    - navn: La Tête de Lard
      type: Bouchon for lokalfolk · Presqu'île
      tekst: "Familiedrevet bouchon med steinvegger og rutete duker. Ekte vare uten turistmenyen."
      apent: Sjekk og book
      adresse: 13 rue Désirée, 69001 Lyon
      sok: La Tête de Lard Lyon
      chip: book
    - navn: Soma
      type: Liten bistro · Saint-Paul
      tekst: "Middelhavsbistro med åpent kjøkken og kort meny, på torget rett ved leiligheten. Godt alternativ en kveld uten bouchon."
      apent: Sjekk og book
      adresse: 9 place Saint-Paul, 69005 Lyon
      sok: Soma 9 place Saint-Paul Lyon
    - navn: La Maison de Guignol
      type: Teater · Vieux Lyon
      tekst: "Guignol er Lyons egen dukke fra 1808, en frekk silkeveverarbeider som gjør narr av øvrigheten. Dukketeater om dagen, café-théâtre om kvelden. På fransk, men det er moro uansett."
      apent: Sjekk programmet
      adresse: 2 montée du Gourguillon, 69005 Lyon
      sok: Théâtre La Maison de Guignol Lyon
      nettside: https://www.lamaisondeguignol.fr/
    - navn: Le Biniou Mercière
      type: Festbar · Presqu'île
      tekst: "Institusjon for sene kvelder: temakvelder og DJ som spiller hits fra 80- til 2000-tallet. Allsang garantert."
      apent: Sene kvelder, særlig i helgene
      adresse: 53 rue Mercière, 69002 Lyon
      sok: Le Biniou Mercière Lyon
    - navn: LOU Rugby
      type: Sport · Gerland
      tekst: "Lyons rugbylag spiller i toppdivisjonen Top 14 på det gamle Gerland-stadion. Billigere og mer folkelig enn fotballen. Sjekk om det er hjemmekamp helga 24.–26. september."
      apent: Sjekk terminlista når den slippes
      adresse: Matmut Stadium de Gerland, 353 avenue Jean Jaurès, 69007 Lyon
      sok: Matmut Stadium de Gerland
      chip: sjekk

# ─────────────────────────────────────────────────────────────
#  DRIKK SOM EN LOKAL – fransk: det du sier, betyr: hva du får
# ─────────────────────────────────────────────────────────────
lokal:
  ingress: "Slik bestiller lyonnaisene, så vi ikke avslører oss som turister i første setning."
  regler:
    - { fransk: "Un café, s'il vous plaît", betyr: "En espresso. «Café» betyr alltid espresso i Frankrike." }
    - { fransk: "Un noisette", betyr: "Espresso med en skvett melk. Det nærmeste en lokal kommer en latte." }
    - { fransk: "Un café crème / un grand crème", betyr: "Kaffe med varm melk. Bare til frokost, aldri etter lunsj." }
    - { fransk: "Un allongé", betyr: "Espresso spedd med vann, det nærmeste vi kommer norsk svart kaffe." }
    - { fransk: "Au comptoir", betyr: "Drikk kaffen stående i baren. Det er billigere enn ved bordet, og det er der lokalfolka står." }
    - { fransk: "Un demi", betyr: "25 cl fatøl, standardølen. «Une pinte» er 50 cl og avslører oss som nordmenn." }
    - { fransk: "Un pot de Côtes-du-Rhône", betyr: "Bouchonens 46 cl-flaske med husets vin. Bestill pot, ikke glass." }
    - { fransk: "Une carafe d'eau", betyr: "Gratis springvann. Ingen lokal betaler for flaskevann til maten." }
    - { fransk: "On prend l'apéro ?", betyr: "Apéro mellom 18 og 20 hører med: et glass, noen oliven og saucisson før middag." }
    - { fransk: "Un communard / un kir", betyr: "Rødvin med cassis, eller hvitvin med cassis. Klassisk apéro i Lyon." }
    - { fransk: "Un petit jaune", betyr: "Slang for pastis, fordi den blir gul når man har vann i." }
    - { fransk: "L'addition, s'il vous plaît", betyr: "Regningen kommer aldri av seg selv. Den må vi be om, og det er høflig at de venter." }
  tips: "Kaffe kommer etter dessert, ikke til. Si alltid «Bonjour» når du går inn i en bar eller butikk. Det er den viktigste regelen av alle."

# Skjulte barer (speakeasies). Legg til flere med samme oppsett.
speakeasy:
  ingress: "Barer uten skilt, med hemmelige dører og bartendere som tar cocktails på alvor. Det er lurt å komme tidlig eller ringe og reservere, for de er små og fylles fort."
  steder:
    - navn: L'Antiquaire
      type: Speakeasy · Pentes de la Croix-Rousse
      tekst: "Ser ut som en gammel antikvitetsbutikk utenfra. Innenfor er det Forbudstid-stemning og noen av byens beste cocktails."
      apent: "Alle dager fra 18:00, til 03:00 fredag og lørdag"
      bestill: "Inngang: Ring på døra og vent på å bli sluppet inn."
      adresse: 20 rue Hippolyte Flandrin, 69001 Lyon
      sok: L'Antiquaire Lyon
    - navn: Soda Bar
      type: Speakeasy · Presqu'île
      tekst: "Inngangen er gjennom sykkelbutikken Baroudeur Cycles. Bak verkstedet åpner det seg en bar i 70-tallsstil med god cocktailmeny."
      apent: "Alle dager 18:00–01:00, torsdag til 02:00, fredag og lørdag til 03:00"
      bestill: "Inngang: Gå inn i sykkelbutikken og videre bakover."
      adresse: 7 rue de la Martinière, 69001 Lyon
      sok: Soda Bar 7 rue de la Martiniere Lyon
    - navn: La Baignoire
      type: Speakeasy · Guillotière
      tekst: "1930-tallsbar i art deco med Peaky Blinders-stemning. Lekre cocktails i skinnstoler og dempet lys."
      apent: "Tirsdag–torsdag 18:00–01:00, fredag og lørdag 18:00–02:30"
      bestill: "Inngang: Se etter en anonym dør uten skilt."
      adresse: 11 rue des Trois Rois, 69007 Lyon
      sok: La Baignoire bar Lyon
    - navn: Le Fantôme de l'Opéra
      type: Speakeasy · Opéra
      tekst: "Tjuetallsbar med grammofon, fløyelsgardiner og cocktails servert i hodeskaller og enhjørningsglass. Teatralsk på den gode måten."
      apent: "Tirsdag–lørdag 18:00–01:00"
      adresse: 19 rue Royale, 69001 Lyon
      sok: Le Fantome de l'Opera bar Lyon
    - navn: Le Passage
      type: Cocktailbar · Cordeliers
      tekst: "Skjult i en smal gate, med fløyel, art deco og jazz. Rolig og elegant, fin for en siste drink."
      apent: "Tirsdag–torsdag 19:00–00:00, fredag og lørdag 19:00–02:00"
      adresse: 8 rue du Plâtre, 69001 Lyon
      sok: Le Passage bar 8 rue du Platre Lyon
    - navn: Le Secret
      type: Hemmelig bar · Terreaux
      tekst: "Den mest hemmelige av dem alle. Baren ligger bak skjønnhetssalongen Les Six Bar & Beauté, og du kommer inn gjennom en speilhylle som glir til side. Jazz fram til 22:30, så DJ."
      apent: "Kveldstid fra 19:00. Sjekk før dere går."
      bestill: "Inngang: Lyset «Le Secret» på gata må være tent. Ring på, gå gjennom salongen og vent ved speilet."
      adresse: rue Joseph Serlin, 69001 Lyon
      sok: Le Secret bar Lyon
      chip: sjekk
    - navn: Bon-Secours Bar
      type: Skjult kjellerbar · Vieux Lyon
      tekst: "Hvelvet kjeller under en sjokoladebutikk fra 1500-tallet, med cocktails på likører fra Crozet. Bare 3 minutter fra leiligheten."
      apent: "Fredag, lørdag og mandag 19:00–00:00. Sjekk før dere går."
      bestill: "Inngang: Gå gjennom sjokoladebutikken og ned trappa."
      adresse: 12 rue du Bœuf, 69005 Lyon
      sok: Ambassade Bonnat Crozet 12 rue du Boeuf Lyon

# Hemmelige Lyon: rare, skjulte og uventede steder, delt i grupper.
hemmelig:
  ingress: "Lyon er en by som gjemmer det beste bak dører, i bakgårder og på tak. Her er stedene som får selv lyonnaisene til å si «det visste jeg ikke»."
  grupper:
    - tittel: Skjulte bakgårder og passasjer
      steder:
        - navn: Cour des Voraces
          type: Traboule · Croix-Rousse
          tekst: "Lyons mest spektakulære traboule. En åtte etasjer høy, frittstående steintrapp i en bakgård der silkearbeiderne bodde. Silkeopprøret i 1848 ble planlagt her."
          apent: "På dagtid. Vær stille, folk bor her."
          bestill: "Inngang: Gå inn ved 9 place Colbert og kom ut i montée Saint-Sébastien."
          adresse: 9 place Colbert, 69001 Lyon
          sok: Cour des Voraces Lyon
        - navn: Hôtel de Bullioud
          type: Skjult renessansegalleri · Vieux Lyon
          tekst: "Innerst i en traboule ligger galleriet Philibert Delorme tegnet etter Italia-turen sin i 1536, Frankrikes første smak av renessansen. Et par minutter fra leiligheten."
          apent: "Bakgården er vanligvis åpen på dagtid."
          adresse: 8 rue Juiverie, 69005 Lyon
          sok: Hotel de Bullioud Lyon
        - navn: Maison Henri IV
          type: Bakgård · Vieux Lyon
          tekst: "Middelalderhus med en praktfull trapp i arkader på slanke søyler. Henri IV bodde faktisk aldri her, men det har ingen brydd seg om på 400 år."
          adresse: 4 rue Juiverie, 69005 Lyon
          sok: Maison Henri IV rue Juiverie Lyon
        - navn: Passage des Imprimeurs
          type: Smal passasje · Presqu'île
          tekst: "Trang passasje med steinbuer og små restauranter, oppkalt etter boktrykkerne som holdt til her. Snarvei fra Saône-kaia til rue Mercière."
          adresse: 26 quai Saint-Antoine, 69002 Lyon
          sok: Passage des Imprimeurs Lyon
        - navn: Escalier Prunelle
          type: Fargerik trapp · Croix-Rousse
          tekst: "En hel trapp malt i sterke farger av kunstneren Genaro Lopez. Fint fotostopp på vei til eller fra Carousel Beer."
          adresse: Rue Prunelle, 69001 Lyon
          sok: Escalier Prunelle Lyon
    - tittel: Det rare og morsomme
      steder:
        - navn: Musée Cinéma et Miniature
          type: Filmrekvisitter og miniatyrer · Vieux Lyon
          tekst: "Over hundre miniatyrscener i skala 1:12 som er så detaljerte at du tror det er bilder, og ekte rekvisitter fra filmer, blant annet Alien-dronningen. Ligger i rue Saint-Jean, rett rundt hjørnet."
          apent: "Hverdager 10:00–18:30 (tirsdag fra 13:30), helg 10:00–19:00. Ca. 23 € per voksen."
          adresse: 60 rue Saint-Jean, 69005 Lyon
          sok: Musee Cinema et Miniature Lyon
          nettside: https://www.lyon.fr/lieu/musees/musee-cinema-et-miniature
        - navn: Likvognbroen og Loyasse
          type: Morbid historie · Fourvière
          tekst: "Passerelle des Quatre-Vents står der «likvognviadukten» gikk, som fraktet kistene til Loyasse-kirkegården. Kirkegården fra 1812 er full av storslåtte gravmæler, og tilhengerne til den mystiske healeren Maître Philippe legger fortsatt blomster på graven hans."
          adresse: Cimetière de Loyasse, 69005 Lyon
          sok: Cimetiere de Loyasse Lyon
        - navn: Hameau Dubœuf
          type: Vin-temapark · Beaujolais
          tekst: "Europas første temapark om vin, 25 min fra vingården. Det morsomste for oss: «vin mystère», der dere smaker en vin uten etikett og skal gjette navn og appellasjon. Perfekt konkurranse for Gourmetklubben. Minigolf med Beaujolais-cruene som hull."
          apent: "Onsdag–søndag 9:30–19:00, siste inngang 17:30. Passer torsdag."
          adresse: 796 route de la Gare, 71570 Romanèche-Thorins
          sok: Hameau Duboeuf Romaneche-Thorins
          nettside: https://www.duboeuf.com/fr/le-parc

# Takbarer. Solnedgang i Lyon i slutten av september er ca. 19:35.
takbarer:
  ingress: "Sola går ned rundt 19:35 i slutten av september. Kom en halvtime før for å få bord, og ta med en jakke, for det blir fort kjølig på taket når sola er borte."
  steder:
    - navn: Les Muses de l'Opéra
      type: Takbar · Opéra, 7. etasje
      tekst: "Øverst i operahuset, under den buede glasskuppelen, med Fourvière rett imot. Bobler, franske viner, cocktails og småretter. Den beste solnedgangsbaren i byen."
      apent: "Mandag–tirsdag 17:30–23:00, onsdag–fredag 17:30–23:30, lørdag 14:00–23:30. Stengt søndag."
      adresse: 1 place de la Comédie, 69001 Lyon
      sok: Les Muses de l'Opera Lyon
    - navn: Le Melhor
      type: Takbar · Sofitel Bellecour
      tekst: "Øverste etasje på Sofitel, med utsikt over Rhône og byen. Elegante cocktails og live jazz. Litt finere stil, så ikke kom i shorts."
      apent: "Mandag–lørdag 18:00–01:00. Stengt søndag."
      adresse: 20 quai du Docteur Gailleton, 69002 Lyon
      sok: Le Melhor Sofitel Lyon
    - navn: Rooftop Têtedoie og Le Phosphore
      type: Takterrasse · Fourvière
      tekst: "Têtedoies takterrasse er åpen april til september, så vi rekker den akkurat. Utsikt over Saône og hele byen, og det er samme hus som middagen lørdag. Er taket stengt, er vinbaren Le Phosphore med terrasse i etasjen under."
      apent: "Tirsdag–søndag 12:00–16:00 og 19:00–00:00. Book gjerne."
      adresse: 4 rue du Professeur Pierre Marion, 69005 Lyon
      sok: Rooftop Tetedoie Lyon
      chip: book
    - navn: Les Terrasses du Fort
      type: Takbar · Croix-Rousse
      tekst: "Takterrasse på det gamle Fort Saint-Laurent, med utsikt over takene i hele byen. Håndverksøl, naturvin og dipp fra småprodusenter i Croix-Rousse. Passer fint før eller etter Carousel Beer."
      apent: "Terrassen er åpen i godværssesongen. Sjekk før dere går."
      adresse: Place Bellevue, 69001 Lyon
      sok: Fort Saint-Laurent Lyon rooftop
      nettside: https://www.hotelfortsaintlaurent.com/bien-etre
      chip: sjekk
    - navn: Rooftop Maison Nô
      type: Takbar · Presqu'île
      tekst: "Øverste etasje på Maison Nô, med utsikt til Fourvière, den rødlyste operakuppelen og klokketårnet på rådhuset. Egne cocktails og lokale viner."
      apent: "Tirsdag–lørdag om kvelden. Sjekk tider før dere går."
      adresse: 11 rue du Bât-d'Argent, 69001 Lyon
      sok: Maison No rooftop Lyon
      nettside: https://www.maisonno.com/
      chip: sjekk
    - navn: Mama Shelter
      type: Takterrasse · Guillotière
      tekst: "Avslappet og leken, med DJ eller live musikk om kvelden. Mindre utsikt enn de andre, men best stemning hvis kvelden skal bli lang."
      apent: "Alle dager 12:00–15:00 og 19:00–00:00"
      adresse: 13 rue Domer, 69007 Lyon
      sok: Mama Shelter Lyon
    - navn: Celest, 32. etasje
      type: Panoramarestaurant · Part-Dieu
      tekst: "Øverst i «Blyanten», Tour Part-Dieu, som er byens mest kjente skyskraper. Hele Lyon under føttene. Best ved solnedgang."
      apent: "Middag onsdag–lørdag 19:30–23:00"
      bestill: "Book bord på forhånd."
      adresse: 129 rue Servient, 69003 Lyon
      sok: Celest Radisson Blu Lyon
      chip: book
    - navn: Le Sucre
      type: Klubb på taket · Confluence
      tekst: "Når solnedgangen er over og kvelden skal bli natt. Takterrasse og klubb på den gamle sukkerfabrikken, med nesten 360 graders utsikt."
      apent: "Fredag og lørdag 23:00–05:00"
      adresse: 50 quai Rambaud, 69002 Lyon
      sok: Le Sucre Lyon
      nettside: https://le-sucre.eu/

# Live musikk. Grupper med steder, samme oppsett som resten.
livemusikk:
  ingress: "Fredag og lørdag er det musikk overalt i Lyon. Rue Saint-Georges og rue Saint-Jean i gamlebyen er fulle av irske puber med trubadurer, og bare noen minutter unna ligger jazzkjellere fra 1700-tallet. Programmet endrer seg fra uke til uke, så sjekk hvem som spiller før dere går."
  grupper:
    - tittel: Irske puber med trubadur
      steder:
        - navn: Fleming's
          type: Irsk pub · Vieux Lyon
          tekst: "Ligger vegg i vegg med leiligheten i rue de la Loge. Konserter med jevne mellomrom, og kortere vei hjem enn dette finnes ikke."
          apent: "Mandag–fredag 17:00–01:00, lørdag og søndag 14:00–01:00"
          adresse: 2 rue de la Loge, 69005 Lyon
          sok: Fleming's Irish Pub 2 rue de la Loge Lyon
        - navn: Johnny Walsh's
          type: Irsk pub · Saint-Georges
          tekst: "Gamlebyens mest kjente musikkpub, med live musikk nesten hver kveld. Trubadurer, irsk folk og allsang. 10 minutter å gå fra leiligheten langs Saône."
          apent: "Tirsdag–lørdag 21:00–03:00"
          adresse: 56 rue Saint-Georges, 69005 Lyon
          sok: Johnny Walsh's Lyon
        - navn: Johnny's Kitchen
          type: Irsk pub og mat · Saint-Georges
          tekst: "Søsterstedet noen dører unna, med mat og live musikk. Fint for å starte kvelden før dere går videre til Johnny Walsh's."
          apent: "Søndag–torsdag 12:00–01:00, fredag og lørdag 12:00–02:00"
          adresse: 48 rue Saint-Georges, 69005 Lyon
          sok: Johnny's Kitchen Lyon
        - navn: Kelly's
          type: Irsk pub · Quai Romain Rolland
          tekst: "Pub ved Saône-kaia med live musikk torsdag og fredag. Holder åpent til 03:00 de kveldene."
          apent: "Torsdag og fredag 18:00–03:00, lørdag 17:00–01:00"
          adresse: 12 quai Romain Rolland, 69005 Lyon
          sok: Kelly's Irish Pub Lyon
        - navn: Flan's
          type: Irsk pub · Terreaux
          tekst: "Tidligere Flanigan's. Konserter i helgene og åpent til 04:00 fredag og lørdag, så dette er stedet når de andre stenger."
          apent: "Alle dager fra 17:00, fredag og lørdag til 04:00"
          adresse: 12 rue du Griffon, 69001 Lyon
          sok: Flan's pub 12 rue du Griffon Lyon
    - tittel: Jazzklubber
      steder:
        - navn: Hot Club de Lyon
          type: Jazzklubb · Presqu'île
          tekst: "Startet i 1948 og regnes som Europas eldste jazzklubb som fortsatt er i drift. Konserter i en hvelvet kjeller, fra bebop og manouche til salsa. Rundt 160 konserter i året."
          apent: "Konserter og jam sessions tirsdag–lørdag om kvelden"
          bestill: "Sjekk programmet og kjøp billett på nettsiden."
          adresse: 26 rue Lanterne, 69001 Lyon
          sok: Hot Club de Lyon jazz
          nettside: http://www.hotclubjazzlyon.com/
        - navn: La Clef de Voûte
          type: Jazzkjeller · Croix-Rousse
          tekst: "Hvelvet kjeller fra 1700-tallet med over 150 konserter i året. Gratis inngang, men dere må reservere på nett."
          apent: "Onsdag–mandag, dørene åpner 19:30 og musikken starter 20:30"
          bestill: "Reserver bord på nettsiden, den fylles fort."
          adresse: 1 place Chardonnet, 69001 Lyon
          sok: La Clef de Voute Lyon jazz
          nettside: https://www.laclefdevoute.fr/
